<script src="analytics-shared.js"></script>
<script>
// breadcrumb back to Analytics keeps the date range it came from
readCustomRange(new URLSearchParams(location.search));
const fromPeriod = new URLSearchParams(location.search).get('period');
if (PERIODS[fromPeriod]) document.getElementById('crumbAnalytics').href = `analytics.html?${new URLSearchParams(periodParams(fromPeriod))}`;

const adsTable = mountAdsTable({
  table: document.getElementById('adsTable'), head: document.getElementById('adsHead'), rows: document.getElementById('adsRows'),
  windowRows: null, // full list — no scroll window here
  linkParams: PERIODS[fromPeriod] ? new URLSearchParams(periodParams(fromPeriod)).toString() : '',
  onRender({ source, count, status }) {
    const none = source === 'none';
    document.getElementById('adsControls').hidden = none;
    document.getElementById('adsDesc').textContent = none ? '' : `${count} ad${count === 1 ? '' : 's'}${status === 'All' ? '' : ` · ${status}`}`;
    document.getElementById('adsCard').hidden = none || count === 0;
    document.getElementById('adsEmpty').hidden = !(none || count === 0);
    document.getElementById('adsEmptyTitle').textContent = none ? 'No Meta ad account connected.' : `No ${status.toLowerCase()} ads.`;
    document.getElementById('adsEmptyBody').textContent = none ? 'Connect a Meta ad account to see how your promoted posts perform.' : 'Try another status.';
  },
});
buildFilter({
  container: document.getElementById('adsStatusFilterWrap'),
  label: 'Status', inactiveLabel: 'Status: All', defaultValue: 'All',
  options: ADS_STATUSES.map((value) => ({ value })),
  onSelect(value) { adsTable.setStatus(value || 'All'); },
});
document.getElementById('adsStatusFilterWrap').classList.add('filter-dropdown--right');
document.getElementById('adsExport').addEventListener('click', () => openAdsExport(adsTable)); // checked rows, else the current view
fitFrameToViewport();
</script>
