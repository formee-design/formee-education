<!-- Promoted content detail (v2) — one ad, opened from a post title in Analytics › Meta Ads Performance or Promoted
     Content. Pulse sets ads up per content (no multi-ad campaigns), so this is one post's ad: the post is the subject,
     its Meta campaign name is metadata. Laid out like Post Performance: 1. header (post title, delivery, dates, objective,
     budget, Meta campaign),
     2. its row from the Meta Ads table (same columns as Analytics / Promoted Content — one row, no sort menus),
     3. Performance Over Time (daily area line chart: Spend / Results / Cost per result), 4. Promoted content (the post).
     No metrics beyond the table's (no CTR / CPM). ?id=c01 … c13 (c12 = the In Draft campaign → draft state: no chart,
     post card marked not published). MOCK data until the Meta API is wired (getMetaCampaign() in analytics-shared.js). -->

<script>
const params = new URLSearchParams(location.search);
readCustomRange(params);
const fromPeriod = params.get('period');
if (PERIODS[fromPeriod]) {
  const q = new URLSearchParams(periodParams(fromPeriod));
  document.getElementById('crumbAnalytics').href = `analytics.html?${q}`;
  document.getElementById('crumbCampaigns').href = `campaigns.html?${q}`;
}
// the range the page opens on: ?range=all from the lifetime lists (Meta Ads table / Promoted Content), else the list's
// ?period (Top Performing / Post Performance), else All time. The selector above the table changes it from there.
let period = PERIODS[params.get('range')] ? params.get('range') : PERIODS[fromPeriod] ? fromPeriod : 'all';
const DASH = '—';
const fmtRange = (a, b) => (diffDays(a, b) === 0 ? fmtDate(a) : a.getFullYear() === b.getFullYear() ? `${fmtDay(a)} – ${fmtDate(b)}` : `${fmtDate(a)} – ${fmtDate(b)}`);
const deliveryChip = (d) => `<span class="ads-delivery${d === 'Active' ? ' ads-delivery--active' : d === 'In Draft' ? ' ads-delivery--draft' : ''}"><span class="ads-delivery__dot"></span>${d}</span>`;
let model = null, adsTable = null, metric = 'spend', unit = null; // unit null = the finest the range allows
const perKOf = (c) => (c.resultType === 'Reach' ? 1000 : 1); // Meta prices Reach per 1,000 people reached

// the ad's delivery inside the picked period — null span = it didn't run then
function current() {
  const c = model.campaign, { start, last } = campaignRange(c);
  const span = last < start ? null : detailSpan(period, start, last);
  const days = span ? model.daily.filter((d) => d.date >= span.start && d.date <= span.end) : [];
  return { c, span, days };
}
// the table row for the period — results / spend from the daily insights; impressions / reach pro-rated by spend (placeholder)
function rowFor(c) {
  if (c.spent === null || period === 'all') return c;
  const { days } = current();
  if (!days.length) return { ...c, results: null, costPerResult: null, spent: null, impressions: null, reach: null };
  const spent = days.reduce((a, d) => a + d.spend, 0), results = days.reduce((a, d) => a + d.results, 0), share = spent / c.spent;
  return { ...c, results, spent, costPerResult: results ? (spent / results) * perKOf(c) : null, impressions: Math.round(c.impressions * share), reach: Math.round(c.reach * share) };
}
function renderTotals() {
  const { c, span } = current();
  document.getElementById('totalsCaption').textContent = period === 'all' || c.spent === null ? 'Lifetime totals'
    : span ? `Totals · ${fmtRange(span.start, span.end)}` : `Totals · ${rangeLabel(periodRange(period))} — no delivery`;
  adsTable.render();
}

function renderChart() {
  const { c, span, days } = current();
  const { start, end, last } = campaignRange(c);
  const draft = c.spent === null, idle = draft || !model.daily.length;
  document.getElementById('chartCard').hidden = idle || !span;
  document.getElementById('chartEmpty').hidden = !(idle || !span);
  document.getElementById('metricTabs').hidden = idle || !span;
  if (idle) {
    document.getElementById('chartDesc').textContent = `Scheduled ${fmtRange(start, end)}`;
    document.getElementById('chartEmptyTitle').textContent = draft ? 'This campaign is still a draft.' : 'No delivery yet.';
    document.getElementById('chartEmptyBody').textContent = "Daily spend, results and cost per result will chart here once it's published and starts delivering.";
    return;
  }
  if (!span) {
    document.getElementById('chartDesc').textContent = `Ran ${fmtRange(start, end)}`;
    document.getElementById('chartEmptyTitle').textContent = 'No delivery in this date range.';
    document.getElementById('chartEmptyBody').textContent = `This ad ran ${fmtRange(start, end)}. Pick another range or All time.`;
    return;
  }
  const live = end > TODAY && span.end >= last;
  // Daily / Weekly / Monthly over the range — same slicing as the Analytics charts
  const units = unitsFor(span.start, span.end);
  const perK = perKOf(c);
  const u = units.includes(unit) ? unit : units[0];
  buildUnitSelect(document.getElementById('chartUnit'), { units, value: u, onChange(v) { unit = v; renderChart(); } });
  const buckets = unitBuckets(span.start, span.end, u).map((bk) => {
    const bd = days.filter((d) => d.date >= bk.start && d.date <= bk.end);
    const spend = bd.reduce((a, d) => a + d.spend, 0), results = bd.reduce((a, d) => a + d.results, 0);
    return { ...bk, spend, results, cpr: results ? (spend / results) * perK : null };
  });
  document.getElementById('chartDesc').textContent = `${UNIT_LABEL[u]}, ${fmtRange(span.start, span.end)}${live ? ' (live — ends ' + fmtDay(end) + ')' : ''}`;
  const values = buckets.map((bk) => bk[metric]);
  const totalSpend = days.reduce((a, d) => a + d.spend, 0), totalRes = days.reduce((a, d) => a + d.results, 0);
  const total = metric === 'spend' ? formatUSD(totalSpend) : metric === 'results' ? fmtInt(totalRes) : (totalRes ? formatUSD((totalSpend / totalRes) * perK) : DASH);
  document.getElementById('chartTotal').textContent = total;
  document.getElementById('chartTotalLabel').textContent = metric === 'spend' ? 'Total spend' : metric === 'results' ? `Total results · ${c.resultType}` : `Average cost per result · ${c.costType}`;
  const fmtV = (v) => (v === null ? 'no results' : metric === 'results' ? `${fmtInt(v)} results` : formatUSD(v));
  drawAreaChart(document.getElementById('campaignChart'), {
    values, labels: buckets.map((bk) => bk.label), height: 260,
    format: metric === 'results' ? formatCount : (v) => (metric === 'cpr' && v < 10 ? `$${v.toFixed(v ? 2 : 0)}` : formatUSDShort(v)),
    tip: (i) => `${u === 'day' ? fmtDate(buckets[i].start) : rangeLabel(buckets[i])} · ${fmtV(values[i])}`,
  });
}

function renderPromo() {
  const c = model.campaign, p = c.content;
  document.getElementById('promoCard').innerHTML = `
    <img class="promo-card__thumb" src="${THUMB}${p.img}" alt="">
    <div class="promo-card__text">
      <p class="promo-card__title">${p.title}</p>
      <p class="promo-card__sub">${p.platform} · ${p.type}${c.spent === null ? ' · not published yet' : ''}</p>
      <p class="promo-card__sub">Meta campaign · ${c.name}</p>
    </div>
    <a class="text-btn" href="../../brand-characters/brand-setup-kit-character-library.html#view=library">Open in Library →</a>`;
}

document.getElementById('metricTabs').addEventListener('click', (e) => {
  const chip = e.target.closest('.controls-segment-chip');
  if (!chip) return;
  metric = chip.dataset.metric;
  document.querySelectorAll('#metricTabs .controls-segment-chip').forEach((b) => b.classList.toggle('controls-segment-chip--selected', b === chip));
  renderChart();
});

fitFrameToViewport();
getMetaCampaign(params.get('id')).then((m) => {
  model = m;
  const c = m.campaign, { start, end } = campaignRange(c);
  document.title = `${c.content.title} — Promoted Content`;
  document.getElementById('crumbName').textContent = c.content.title;
  document.getElementById('campaignName').textContent = c.content.title;
  document.getElementById('campaignMeta').innerHTML = [
    deliveryChip(c.delivery),
    fmtRange(start, end),
    c.resultType || 'Website Applications',
    c.budget === null ? c.budgetType : `${formatUSD(c.budget)} ${c.budgetType.toLowerCase()} budget`,
    `Meta campaign · ${c.name}`,
  ].join('<span class="campaign-meta__sep"></span>');
  adsTable = mountAdsTable({ table: document.getElementById('adsTable'), head: document.getElementById('adsHead'), rows: document.getElementById('adsRows'), only: c.id, rowData: rowFor });
  bindDetailPeriod({ initial: period, onChange(key) { period = key; unit = null; renderTotals(); renderChart(); } });
  renderTotals();
  renderChart();
  renderPromo();
  // Export — this ad's row + its daily delivery for the picked period. A draft has nothing to export yet.
  const exportBtn = document.getElementById('adsExport');
  exportBtn.disabled = c.spent === null;
  exportBtn.title = c.spent === null ? 'Nothing to export yet — this ad hasn\'t been published.' : '';
  exportBtn.addEventListener('click', () => {
    const { span, days } = current();
    const from = span ? span.start : start, to = span ? span.end : campaignRange(c).last;
    openExportModal({
      title: 'Export ad data – daily breakdown',
      intro: `This file contains this ad's totals and its daily spend, results and cost per result from ${fmtDMYlong(from)} to ${fmtDMYlong(to)}.`,
      notices: ['The Off / On column isn\'t included in the file — the ad\'s status is in the Delivery column.'],
      defaultName: `Formee Express, ${c.content.title}, ${fmtDMYlong(from)}–${fmtDMYlong(to)}`,
      build: () => ({ text: `${adsCSV([rowFor(c)])}\n\n${toCSV(['Date', 'Amount spent (USD)', 'Results', 'Cost per result (USD)'], days.map((d) => [fmtISO(d.date), d.spend.toFixed(2), d.results, d.cpr === null ? '' : d.cpr.toFixed(2)]))}` }),
    });
  });
});
</script>
</body>
</html>
