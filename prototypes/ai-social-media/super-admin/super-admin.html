/* ============================================================================
   Super Admin — Formee's own console for every customer account on Pulse.
   Source: the staging Super Admin pages copied into Figma (FME_AI-Social-Media "As is",
   13605:571413 — Dashboard / Accounts (+ Suspend) / Account details / Activity / Settings),
   restyled onto the AI Social Media components so it reads like the v3 Settings screens
   (brand-setup-kit-v3.html #view=settings): same sidebar + top bar, 22px page title over a
   one-line description, white tables with a neutral-100 head, Feedback / Status Chip badges,
   Brand / Mark + Brand / Logo Tile, row-end More Button menu, confirm modal without an X.
   Dashboard follows the customer Home (Figma 12427:416860): hero banner with the glass Stats
   summary, then "Needs attention" as Data / card / content type tiles, Recent accounts table and
   Top spend list. Accounts are text only (no avatar/mark) — Super Admin can't change an account's
   picture, so the list doesn't pretend it has one.
   Separate console — it is not a scope of the customer app, so the sidebar shows a fixed
   "Super Admin" label instead of the account switcher and only the four admin pages.
   #view=dashboard|accounts|account|activity|settings  ·  &id=<account>  ·  &tab=overview|usage|generations|members
   ============================================================================ */
*{box-sizing:border-box;}
html{display:flex; align-items:center; justify-content:center; min-height:100vh; margin:0; background:var(--color-neutral-200);}
body{margin:0; overflow:hidden; color:var(--color-neutral-900); font-family:var(--font-family-text); font-optical-sizing:none; font-variation-settings:"opsz" 14;}
button{font:inherit;}
.frame{position:relative; width:1920px; height:1162px; flex-shrink:0; transform-origin:top left; overflow:hidden; display:flex; align-items:stretch; background:var(--color-neutral-50); border:1px solid var(--color-neutral-300);}
.frame > .sidebar{height:100%;}
.right-col{position:relative; flex:1 0 0; min-width:1px; height:100%; display:flex; flex-direction:column;}
.right-col > main{flex:1 0 0; min-height:0; overflow-y:auto; background:var(--color-neutral-75);}
.home-fab{position:fixed; left:16px; bottom:16px; z-index:9999; display:flex; gap:7px; align-items:center; background:var(--color-neutral-900); border-radius:var(--radius-full); padding:var(--spacing-sm) var(--spacing-lg); box-shadow:var(--shadow-popover); color:var(--color-neutral-0); font-size:var(--font-size-text-xs); font-weight:var(--font-weight-semibold); text-decoration:none; white-space:nowrap;}

/* ---------- sidebar: fixed console label instead of the account switcher ---------- */
.sa-scope{display:flex; align-items:center; gap:var(--spacing-sm); height:36px; padding:0 var(--spacing-md); border:1px solid var(--color-neutral-300); border-radius:var(--radius-lg); background:var(--color-neutral-100); font-size:var(--font-size-text-sm); line-height:var(--line-height-text-sm); font-weight:var(--font-weight-semibold); color:var(--color-neutral-900);}
.sa-scope img{width:16px; height:16px;}
.sa-scope span:last-child{margin-left:auto; font-weight:var(--font-weight-regular); color:var(--color-neutral-500); font-size:var(--font-size-text-xs);}
.sidebar{position:relative;}
.sa-me{position:absolute; left:var(--spacing-md); right:var(--spacing-md); bottom:var(--spacing-lg); display:flex; align-items:center; gap:var(--spacing-sm); padding:var(--spacing-sm); border-radius:var(--radius-lg); border:0; background:none; cursor:pointer; text-align:left;}
.sa-me:hover{background:var(--color-neutral-100);}
.sa-me-txt{display:flex; flex-direction:column; min-width:0;}
.sa-me-txt b{font-size:var(--font-size-text-sm); line-height:var(--line-height-text-sm); font-weight:var(--font-weight-semibold); color:var(--color-neutral-900);}
.sa-me-txt span{font-size:var(--font-size-text-xs); line-height:var(--line-height-text-xs); color:var(--color-neutral-500); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}

/* ---------- page ---------- */
.sa-page{display:flex; flex-direction:column; gap:var(--spacing-xl); padding:28px 28px 60px; /* 토큰 없음: Figma Home Main Content 28 / 60 */}
.sa-page[hidden]{display:none;}
.sa-head{display:flex; align-items:flex-start; justify-content:space-between; gap:var(--spacing-lg);}
.sa-title{margin:0; font-size:var(--font-size-display-sm); line-height:var(--line-height-display-sm); font-weight:var(--font-weight-display-sm); color:var(--color-neutral-900);}
.sa-sub{margin:var(--spacing-xs) 0 0; font-size:var(--font-size-text-sm); line-height:var(--line-height-text-sm); color:var(--color-neutral-500);}
.sa-back{display:inline-flex; align-items:center; gap:var(--spacing-xs); margin-bottom:var(--spacing-sm); padding:0; border:0; background:none; cursor:pointer; font-size:var(--font-size-text-sm); line-height:var(--line-height-text-sm); font-weight:var(--font-weight-medium); color:var(--color-neutral-500);}
.sa-back:hover{color:var(--color-neutral-900);}
.sa-back img{width:16px; height:16px;}
.sa-titleline{display:flex; align-items:center; gap:var(--spacing-md);}
.sa-titleline .sa-title{display:flex; align-items:center; gap:var(--spacing-sm);}

/* section heads inside a page */
.sa-sechead{display:flex; align-items:flex-end; justify-content:space-between; gap:var(--spacing-lg);}
.sa-sectitle{margin:0; font-size:var(--font-size-text-lg); line-height:var(--line-height-text-lg); font-weight:var(--font-weight-semibold); color:var(--color-neutral-900);}
.sa-secsub{margin:var(--spacing-2) 0 0; font-size:var(--font-size-text-xs); line-height:var(--line-height-text-xs); color:var(--color-neutral-500);}
.sa-grid{display:grid; grid-template-columns:minmax(0, 1.6fr) minmax(0, 1fr); gap:var(--spacing-xl); align-items:start;}
.sa-col{display:flex; flex-direction:column; gap:var(--spacing-xl); min-width:0;}
.sa-grid2{display:grid; grid-template-columns:1fr 1fr; gap:var(--spacing-xl); align-items:stretch;}

/* card + table — same look as the Settings › Members table (settings-members-table-head.css) */
.sa-card{background:var(--color-neutral-0); border:1px solid var(--color-neutral-200); border-radius:var(--radius-lg); overflow:hidden;}
.sa-card-head{display:flex; align-items:center; justify-content:space-between; gap:var(--spacing-md); padding:var(--spacing-lg) var(--spacing-lg) var(--spacing-md) var(--spacing-xl);}
.sa-card-body{padding:0 var(--spacing-xl) var(--spacing-xl);}
.sa-tr{display:flex; align-items:center; gap:var(--spacing-lg); padding:var(--spacing-md) var(--spacing-lg) var(--spacing-md) var(--spacing-xl); border-bottom:1px solid var(--color-neutral-150); font-size:var(--font-size-text-sm); line-height:var(--line-height-text-sm); color:var(--color-neutral-900);}
.sa-tr.head{height:40px; padding-top:0; padding-bottom:0; background:var(--color-neutral-100); border-top:1px solid var(--color-neutral-200); border-bottom-color:var(--color-neutral-200); font-size:var(--font-size-text-xs); line-height:var(--line-height-text-xs); font-weight:var(--font-weight-semibold); color:var(--color-neutral-700);}
.sa-card > .sa-tr.head:first-child{border-top:0;}
.sa-tr.link{cursor:pointer;}
.sa-tr.link:hover, .sa-tr.hl{background:var(--color-neutral-75);}
.sa-tr.is-suspended .sa-nm{color:var(--color-neutral-500);}
.sa-tr.is-stuck{background:var(--color-badge-orange-bg);}
.sa-card > .sa-tr:last-child{border-bottom:0;}
.sa-c{display:flex; align-items:center; gap:var(--spacing-sm); min-width:0;}
.sa-c.col{flex-direction:column; align-items:flex-start; gap:var(--spacing-2);}
.sa-c.num{justify-content:flex-end; text-align:right; font-variant-numeric:tabular-nums;}
.sa-c.end{justify-content:flex-end;}
.sa-nm{font-weight:var(--font-weight-semibold); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%;}
.sa-mute{font-size:var(--font-size-text-xs); line-height:var(--line-height-text-xs); color:var(--color-neutral-500); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%;}
.sa-strong{font-weight:var(--font-weight-semibold);}
.sa-mono{font-family:var(--font-family-mono); font-size:var(--font-size-mono-sm); line-height:var(--line-height-mono-sm); color:var(--color-neutral-700);}
.sa-dash{color:var(--color-neutral-500);}
.sa-foot{display:flex; align-items:center; justify-content:space-between; gap:var(--spacing-lg); padding:var(--spacing-md) var(--spacing-lg) var(--spacing-md) var(--spacing-xl); border-top:1px solid var(--color-neutral-150); font-size:var(--font-size-text-xs); line-height:var(--line-height-text-xs); color:var(--color-neutral-500);}
.sa-pager{display:flex; align-items:center; gap:var(--spacing-sm);}
.sa-err{font-size:var(--font-size-text-xs); line-height:var(--line-height-text-xs); color:var(--color-error-text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%;}
.sa-empty{padding:var(--spacing-4xl) var(--spacing-xl); text-align:center; font-size:var(--font-size-text-sm); line-height:var(--line-height-text-sm); color:var(--color-neutral-500);}

/* toolbar: segment filter + search */
.sa-bar{display:flex; align-items:center; justify-content:space-between; gap:var(--spacing-md); flex-wrap:wrap;}
.sa-seg{display:inline-flex; padding:var(--spacing-xs); background:var(--color-neutral-150); border-radius:var(--radius-xl);}
.sa-seg .segment-chip{font-size:var(--font-size-text-sm); line-height:var(--line-height-text-sm); color:var(--color-neutral-500);}
.sa-seg .segment-chip--active{color:var(--color-neutral-900);}
.sa-seg .segment-chip b{margin-left:var(--spacing-xs); font-weight:inherit; color:var(--color-neutral-500);}
.sa-bar .search-field--expanded{width:320px;}
.sa-bar .search-field__input{font-size:var(--font-size-text-sm);}

/* account columns */
.ac-account{flex:0 0 260px;} .ac-owner{flex:1 1 0;} .ac-n{flex:0 0 80px;} .ac-role{flex:0 0 116px;} .ac-gen{flex:0 0 110px;} .ac-spend{flex:0 0 110px;} .ac-status{flex:0 0 110px;} .ac-act{flex:0 0 40px;}
/* activity columns */
.av-account{flex:0 0 200px;} .av-brand{flex:0 0 190px;} .av-by{flex:0 0 300px;} .av-format{flex:0 0 100px;} .av-status{flex:0 0 150px;} .av-stage{flex:0 0 110px;} .av-updated{flex:0 0 100px;} .av-err{flex:1 1 0;} .av-act{flex:0 0 80px;}
/* generations table (account details) */
.gn-id{flex:0 0 150px;} .gn-brand{flex:1 1 0;} .gn-type{flex:0 0 200px;} .gn-req{flex:0 0 100px;} .gn-got{flex:0 0 100px;} .gn-status{flex:0 0 120px;} .gn-created{flex:0 0 190px;}

/* dashboard — Home layout (12427:416860); stat icons from Figma Stats summary 14149:653678
   (icon / building-complex · panel / brand · circle-user-round · nav / billing, all from components icons/). The hero frame's gradient and glow ellipses are Figma
   literals with no tokens (same values as home/home.html); glow art copied to ./assets. */
.sa-page[data-page="dashboard"]{gap:var(--spacing-4xl);}
.hero{position:relative; overflow:hidden; display:flex; flex-direction:column; gap:var(--spacing-2xl); padding:28px; border:var(--border-width-1) solid rgba(255,255,255,.8); border-radius:var(--radius-xl); background:linear-gradient(to right, rgba(248,238,246,.27), #efeffb 50%, #e4edfd); margin-bottom:calc(var(--spacing-xl) - var(--spacing-4xl));}
.hero__glow{position:absolute; pointer-events:none;}
.hero__glow img{position:absolute; display:block; max-width:none;}
.hero__glow--primary{left:1041px; top:-141px; width:520px; height:320px;}
.hero__glow--primary img{inset:-37.5% -23.08%; width:calc(100% + 46.16%); height:calc(100% + 75%);}
.hero__glow--accent{left:-81px; top:77px; width:420px; height:260px;}
.hero__glow--accent img{inset:-46.15% -28.57%; width:calc(100% + 57.14%); height:calc(100% + 92.3%);}
.hero > :not(.hero__glow){position:relative;}
.hero__header{display:flex; flex-direction:column; align-items:flex-start; gap:var(--spacing-lg);}
.hero__title-block{display:flex; flex-direction:column; gap:var(--spacing-xs);}
.hero__meta{margin:0; font-size:var(--font-size-text-sm); line-height:var(--line-height-text-sm); color:var(--color-neutral-500);}
.hero__title{margin:0; font-size:var(--font-size-display-md); line-height:var(--line-height-display-md); font-weight:var(--font-weight-bold); letter-spacing:-0.2px; /* 토큰 없음: Figma Display/md -0.2 */}
.hero__actions{display:flex; align-items:center; gap:var(--spacing-sm);}
.hero__actions a{text-decoration:none;}
.home-section{display:flex; flex-direction:column; gap:var(--spacing-lg); min-width:0;}
.header-row{display:flex; align-items:baseline; justify-content:space-between; gap:var(--spacing-md); height:48px;}
.header-row > .trends-section-header{flex:none; width:auto;}
.quick-row{display:flex; align-items:stretch; gap:var(--spacing-lg);}
.content-type-card__icon img{width:24px; height:24px;}
.split-row{display:flex; align-items:flex-start; gap:var(--spacing-2xl);}
.split-row > .home-section{flex:1 0 0; min-width:1px;}
.list-card{display:flex; flex-direction:column; overflow:hidden; background:var(--color-neutral-0); border:var(--border-width-1) solid var(--color-neutral-400); border-radius:var(--radius-xl); box-shadow:var(--shadow-md);}
.lc-head, .lc-row{display:flex; align-items:center; gap:var(--spacing-lg); padding:var(--spacing-md) var(--spacing-lg) var(--spacing-md) var(--spacing-xl);}
.lc-head{padding-top:10px; padding-bottom:10px; /* 토큰 없음: Figma 10 */ border-bottom:var(--border-width-1) solid var(--color-neutral-150); font-size:var(--font-size-text-xs); line-height:var(--line-height-text-xs); font-weight:var(--font-weight-semibold); color:var(--color-neutral-500);}
.lc-row{border-bottom:var(--border-width-1) solid var(--color-neutral-150); cursor:pointer; min-height:61px;}
.lc-row:last-child{border-bottom:0;}
.lc-row:hover{background:var(--color-neutral-100);}
.cell-text{display:flex; flex-direction:column; gap:var(--spacing-2); min-width:0; white-space:nowrap;}
.cell-main{font-size:var(--font-size-text-sm); line-height:var(--line-height-text-sm); font-weight:var(--font-weight-semibold); color:var(--color-neutral-900); overflow:hidden; text-overflow:ellipsis;}
.cell-sub{font-size:var(--font-size-text-xs); line-height:var(--line-height-text-xs); color:var(--color-neutral-500); overflow:hidden; text-overflow:ellipsis;}
.cell-big{font-size:var(--font-size-text-xl); line-height:var(--line-height-text-xl); font-weight:var(--font-weight-semibold); color:var(--color-neutral-900); font-variant-numeric:tabular-nums;}
.ra-account{flex:1 0 0; min-width:1px;} .ra-brands{width:72px; flex-shrink:0; text-align:right;} .ra-created{width:120px; flex-shrink:0;} .ra-status{width:96px; flex-shrink:0; display:flex;}
.ts-rank{width:12px; flex-shrink:0; font-size:var(--font-size-text-md); line-height:var(--line-height-text-md); font-weight:var(--font-weight-semibold);}
.ts-account{flex:1 0 0; min-width:1px;} .ts-gens{width:112px; flex-shrink:0;} .ts-spend{width:88px; flex-shrink:0;}
.lc-row.ts{padding-top:var(--spacing-lg); padding-bottom:var(--spacing-lg);}
/* dashboard lists */
.sa-list-row{display:flex; align-items:center; gap:var(--spacing-md); padding:var(--spacing-md) var(--spacing-xl); border-top:1px solid var(--color-neutral-150); cursor:pointer;}
.sa-list-row:hover{background:var(--color-neutral-75);}
.sa-list-row .grow{flex:1 1 auto; min-width:0; display:flex; flex-direction:column; gap:var(--spacing-2);}
.sa-rank{width:24px; flex:none; font-size:var(--font-size-text-xs); line-height:var(--line-height-text-xs); font-weight:var(--font-weight-semibold); color:var(--color-neutral-500); text-align:center;}
.sa-amt{font-size:var(--font-size-text-sm); line-height:var(--line-height-text-sm); font-weight:var(--font-weight-semibold); font-variant-numeric:tabular-nums;}
.sa-alert{display:flex; align-items:center; gap:var(--spacing-md); padding:var(--spacing-md) var(--spacing-xl); border-top:1px solid var(--color-neutral-150); cursor:pointer;}
.sa-alert:hover{background:var(--color-neutral-75);}
.sa-alert .grow{flex:1; min-width:0; display:flex; flex-direction:column; gap:var(--spacing-2);}
.sa-alert img.chev{width:16px; height:16px; flex:none;}
.sa-dot{width:8px; height:8px; border-radius:var(--radius-full); flex:none;}
.sa-dot.red{background:var(--color-error-text);} .sa-dot.orange{background:var(--color-warning-text);} .sa-dot.gray{background:var(--color-neutral-450);}

/* bars (usage breakdowns) */
.sa-bars{display:flex; flex-direction:column; gap:var(--spacing-md);}
.sa-barrow{display:grid; grid-template-columns:140px 1fr 56px 44px; align-items:center; gap:var(--spacing-md); font-size:var(--font-size-text-sm); line-height:var(--line-height-text-sm);}
.sa-barrow .v{text-align:right; font-weight:var(--font-weight-semibold); font-variant-numeric:tabular-nums;}
.sa-barrow .p{text-align:right; font-size:var(--font-size-text-xs); color:var(--color-neutral-500); font-variant-numeric:tabular-nums;}
.sa-track{height:6px; border-radius:var(--radius-full); background:var(--color-neutral-150); overflow:hidden;}
.sa-fill{height:100%; border-radius:var(--radius-full); background:var(--color-brand-primary);}
.sa-fill.muted{background:var(--color-neutral-450);}
.sa-fill.red{background:var(--color-error-text);}
.sa-group-label{margin:var(--spacing-lg) 0 var(--spacing-sm); font-size:var(--font-size-text-xs); line-height:var(--line-height-text-xs); font-weight:var(--font-weight-semibold); color:var(--color-neutral-700);}
.sa-note{margin:var(--spacing-lg) 0 0; font-size:var(--font-size-text-xs); line-height:var(--line-height-text-xs); color:var(--color-neutral-500);}
.sa-total{font-size:var(--font-size-text-xs); line-height:var(--line-height-text-xs); color:var(--color-neutral-500);}

/* overview breakdowns — staging layout: two groups side by side in one card (13605:569277 / 569394) */
.sa-kicker{margin:0; font-size:var(--font-size-text-xs); line-height:var(--line-height-text-xs); font-weight:var(--font-weight-semibold); letter-spacing:.06em; text-transform:uppercase; color:var(--color-neutral-500);}
.sa-bd{display:flex; flex-direction:column; gap:var(--spacing-xl); padding:var(--spacing-xl);}
.sa-bd-head{display:flex; align-items:center; justify-content:space-between; gap:var(--spacing-md);}
.sa-bd-cols{display:grid; grid-template-columns:1fr 1fr; gap:var(--spacing-3xl); align-items:start; flex:1;}
.sa-bd-col{display:flex; flex-direction:column; gap:var(--spacing-md);}
.sa-bd-col > .sa-group-label{margin:0;}
.sa-srow{display:flex; flex-direction:column; gap:var(--spacing-sm);}
.sa-srow-top{display:grid; grid-template-columns:1fr auto 44px; gap:var(--spacing-md); align-items:baseline; font-size:var(--font-size-text-md); line-height:var(--line-height-text-md); color:var(--color-neutral-900);}
.sa-srow-top b{font-weight:var(--font-weight-semibold); font-variant-numeric:tabular-nums;}
.sa-srow-top .p{text-align:right; font-size:var(--font-size-text-xs); color:var(--color-neutral-500); font-variant-numeric:tabular-nums;}
.sa-srow .sa-track{height:4px; background:var(--color-neutral-100);}
.sa-bd .sa-note{margin:0;}
/* cost table */
.sa-kv{display:flex; flex-direction:column;}
.sa-kv .r{display:grid; grid-template-columns:1fr 110px 110px; gap:var(--spacing-md); align-items:center; padding:var(--spacing-sm) 0; border-bottom:1px solid var(--color-neutral-150); font-size:var(--font-size-text-sm); line-height:var(--line-height-text-sm);}
.sa-kv .r > :not(:first-child){text-align:right; font-variant-numeric:tabular-nums;}
.sa-kv .r.h{font-size:var(--font-size-text-xs); line-height:var(--line-height-text-xs); font-weight:var(--font-weight-semibold); color:var(--color-neutral-700);}
.sa-kv .r.sub{font-weight:var(--font-weight-semibold); background:var(--color-neutral-75); padding-left:var(--spacing-sm); padding-right:var(--spacing-sm);}

  function closeMenu(){ var m=$('#s3Menu'); if(m) m.remove(); document.querySelectorAll('.s3-more.on, .s3-dd.on').forEach(function(x){x.classList.remove('on');}); document.querySelectorAll('#setMain .s3-tr.hl').forEach(function(x){x.classList.remove('hl');}); S.menu=null; }
  function openMenu(anchor, html, width){
    closeMenu();
    var m=document.createElement('div'); m.className='s3-menu'; m.id='s3Menu'; m.innerHTML=html; if(width) m.style.width=width+'px';
    /* 프레임은 창 크기에 맞춰 scale 된다 — 메뉴도 프레임 안에 넣어야 같은 배율로 보인다 */
    var fr=document.querySelector('.frame'); fr.appendChild(m);
    var fb=fr.getBoundingClientRect(), k=fb.width/fr.offsetWidth, r=anchor.getBoundingClientRect();
    var a={top:(r.top-fb.top)/k, bottom:(r.bottom-fb.top)/k, right:(r.right-fb.left)/k};
    var top=a.bottom+6, left=a.right-m.offsetWidth;
    if (top+m.offsetHeight > fr.offsetHeight-8) top = a.top-6-m.offsetHeight;

  /* ---------- modals ---------- */

  function closeLayer(){ closeMenu(); var L=$('#s3Layer'); L.hidden=true; S.ed=null; S.inv=null; }

  function sendInvite(){
    var I=S.inv; I.emails=$('#s3invEmail').value;
    var ems = I.emails.split(',').map(function(s){return s.trim();}).filter(Boolean);
    if (!ems.length || ems.some(function(em){ return !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em); })){ $('#s3invEmail').style.borderColor='var(--s3-danger)'; return; }
    if (!I.brands.length){ toast('Pick at least one brand'); return; }
    ems.forEach(function(em){
      var p = P.find(function(x){return x.email===em;});
      if (!p){ p={id:'u'+Date.now()+Math.random().toString(36).slice(2,5), name:null, email:em, status:'Invited', sent:'just now'}; P.push(p); }
      I.brands.forEach(function(b){ A[b]=A[b]||{}; A[b][p.id]=I.role; });
    });
    closeLayer(); S.mStatus='All'; render(); toast(ems.length>1 ? ems.length+' invites sent' : 'Invite sent to '+ems[0]);
  }
  function createBrandModal(){
    var body = '<div class="s3-field"><span class="s3-label">Brand name</span><input class="s3-input s3-dfull" id="s3bName" placeholder="e.g. Acme Studio"></div>'+
      '<div class="s3-field"><span class="s3-label">Industry</span><select class="s3-rolesel s3-dfull" id="s3bInd"><option>Education</option><option>Technology &amp; SaaS</option><option>Fashion &amp; Lifestyle</option><option>Other</option></select></div>';
    modal('Create brand', 'You can finish the rest in Brand Setup.', body, 'Create brand', function(){
      var n = $('#s3bName').value.trim(); if (!n){ $('#s3bName').style.borderColor='var(--s3-danger)'; return false; }
      if (brand(n)){ toast('A brand with that name already exists'); return false; }
      var ini = n.split(/\s+/).map(function(w){return w[0];}).join('').slice(0,2).toUpperCase(); if (ini.length<2) ini = n.slice(0,2).toUpperCase();
      B.push({name:n, ini:ini, tone:TONES[B.length % TONES.length], status:'Draft'}); A[n]={};
      S.axBrand=n; render(); toast(n+' created');

  /* Super Admin 만 — 계정 Admin 은 한 명. 넘기면 예전 Admin 은 브랜드 없는 멤버로 남는다 */
  function transferModal(){
    var cand = P.filter(function(p){ return p.id!==OWNER && p.status==='Active'; });
    if (!S.xfer || !cand.some(function(p){ return p.id===S.xfer; })) S.xfer = (cand.find(function(p){ return p.id==='yejin'; }) || cand[0]).id;   /* Figma K3 기본값 */
    var cur = person(S.xfer);
    var body = '<div class="s3-field"><span class="s3-label">New account admin</span>'+
      '<button type="button" class="s3-dd full" data-s3menu="xf:x"><span class="lb">'+esc(cur.name||cur.email)+'</span><img class="cv" src="assets/chevron-down-700.svg" alt=""></button>'+
      '<span class="s3-hint">One account admin per account. '+esc(person(OWNER).name)+' stays as a member — set their brands on the Brands tab.</span></div>';
    modal('Transfer account admin', 'The account admin owns billing and every brand.', body, 'Transfer', function(){
      var id = S.xfer, prev = person(OWNER);
      Object.keys(A).forEach(function(b){ delete A[b][id]; });
      OWNER = id; S.xfer = null; render(); toast((person(id).name||person(id).email)+' is now the account admin · '+prev.name+' stays as a member');
    });
  }
  /* Manage brands → 브랜드 워크스페이스(같은 파일의 Brand 화면, 카드 목록) */
  function openWorkspace(){
    closeMenu();
    if (typeof showView!=='function'){ toast('Manage brands opens the brand workspace in the customer app'); return; }   /* Super Admin console: no brand workspace view here */
    history.replaceState(null,'',location.pathname);
    showView('brand'); if (typeof backToWorkspace==='function') backToWorkspace();
  }
  function renameModal(name){
    modal('Rename brand', 'Members and content stay the same.', '<div class="s3-field"><span class="s3-label">Brand name</span><input class="s3-input s3-dfull" id="s3rn" value="'+esc(name)+'"></div>', 'Save', function(){
      var n=$('#s3rn').value.trim(); if(!n||n===name) return true; if (brand(n)){ toast('A brand with that name already exists'); return false; }
      brand(name).name=n; A[n]=A[name]||{}; delete A[name]; if (S.axBrand===name) S.axBrand=n; render(); toast('Renamed to '+n);
    });
  }

  /* ---------- menus that open from a [data-s3menu] ---------- */
  function openKind(t, k){
    var i=k.indexOf(':'), kind=k.slice(0,i), id=k.slice(i+1);
    if (kind==='m') return memberMenu(t,id);
    if (kind==='b') return brandMenu(t,id);
    if (kind==='r'){ S.menu=k; return openMenu(t, roleItems(A[S.axBrand][id], 'setrole', id, 'removeaccess'), 360); }
    if (kind==='a'){ S.menu=k; return openMenu(t, roleItems(S.addRole, 'addrole', 'x'), 360); }
    if (kind==='e'){ S.menu=k; return openMenu(t, roleItems(S.ed.d[id], 'edrole', id, 'edremovebrand'), 372); }
    if (kind==='eadd'){ S.menu=k; var left=scopeBrands().filter(function(n){ return !S.ed.d[n]; });
      return openMenu(t, left.map(function(n){ return '<button type="button" class="s3-mi" data-s3act="edadd" data-id="'+esc(n)+'">'+mark(brand(n),20)+'<span class="opt"><b style="font-weight:400">'+esc(n)+'</b></span></button>'; }).join(''), 260); }
    if (kind==='ib'){ S.menu=k; return openMenu(t, '<div class="s3-msearch"><label><input id="s3ibq" placeholder="Search brands" autocomplete="off"><img src="assets/search-700.svg" alt=""></label></div>'+   /* Voices 언어·억양 필터처럼 맨 위 검색칸 */
      scopeBrands().map(function(n){ var on=S.inv.brands.indexOf(n)>=0;
      return '<button type="button" class="s3-mi" data-s3act="invbrand" data-id="'+esc(n)+'"><input type="checkbox" class="cb" tabindex="-1"'+(on?' checked':'')+'><span class="opt"><b style="font-weight:400">'+esc(n)+'</b></span></button>'; }).join('')+
      (isBA()?'<p class="s3-mhint">Only brands you manage are listed. Ask your account admin for other brands.</p>':''), t.offsetWidth); }
    if (kind==='ir'){ S.menu=k; return openMenu(t, roleItems(S.inv.role, 'invrole', 'x'), t.offsetWidth); }
    if (kind==='xf'){ S.menu=k; return openMenu(t, P.filter(function(p){ return p.id!==OWNER && p.status==='Active'; }).map(function(p){
      return '<button type="button" class="s3-mi'+(p.id===S.xfer?' sel':'')+'" data-s3act="xferpick" data-id="'+p.id+'"><span class="opt"><b>'+esc(p.name)+'</b></span>'+(p.id===S.xfer?'<img class="ck" src="'+IC+'check.svg" alt="">':'')+'</button>'; }).join(''), t.offsetWidth); }
  }

  /* ---------- actions ---------- */
  function act(a, id, el){
    var keep = a==='invbrand';
    if (!keep) closeMenu();
    var p = person(id);
    if (a==='resend'){ toast('Invite sent again to '+p.email); return; }
    if (a==='editaccess'){ S.ed=null; return editModal(id); }
    if (a==='cancelinvite') return confirmBox('Cancel this invite?', p.email+' won’t be able to join with the link they received.', 'Cancel invite', function(){ Object.keys(A).forEach(function(b){ delete A[b][id]; }); P.splice(P.indexOf(p),1); render(); toast('Invite cancelled'); }, 'Keep invite');
    if (a==='removemember') return confirmBox('Remove '+(p.name||p.email)+'?', 'They lose access to every brand in this account. Their content stays.', 'Remove member', function(){ Object.keys(A).forEach(function(b){ delete A[b][id]; }); P.splice(P.indexOf(p),1); render(); toast('Member removed'); });
    if (a==='removemine') return confirmBox('Remove '+(p.name||p.email)+' from your brands?', 'They lose access to '+accessOf(id).map(function(x){return x.brand;}).join(' and ')+'. Other brands stay.', 'Remove', function(){ myBrands().forEach(function(b){ if (A[b]) delete A[b][id]; }); render(); toast('Removed from your brands'); });
    if (a==='setrole'){   /* 핸드오프 노트: 고르면 바로 저장 — 확인 창·토스트 없음. 저장 실패면 원래 역할로 되돌리고 오류 표시 */
      var rb=S.axBrand, prev=A[rb][id], next=el.dataset.role; if (next===prev) return;
      A[rb][id]=next; render();
      if (S.fail) setTimeout(function(){ if (A[rb] && A[rb][id]===next){ A[rb][id]=prev; render(); } toast('Couldn’t change '+(p.name||p.email)+'’s role. Try again.', true); }, 700);
      return; }
    if (a==='removeaccess'){ var bn=S.axBrand; return confirmBox('Remove '+(p.name||p.email)+' from '+bn+'?', 'They can’t work on this brand anymore. Their content stays.', 'Remove access', function(){ delete A[bn][id]; render(); toast('Access removed from '+bn); }); }   /* D2-1 · J3 확인 창 먼저 */
    if (a==='addrole'){ S.addRole=el.dataset.role; var q=$('#s3addq').value; render(); $('#s3addq').value=q; return; }
    if (a==='edrole'){ S.ed.d[id]=el.dataset.role; return editModal(S.ed.pid); }
    if (a==='edremovebrand'){ delete S.ed.d[id]; return editModal(S.ed.pid); }
    if (a==='edadd'){ S.ed.d[id]='User'; return editModal(S.ed.pid); }
    if (a==='invbrand'){ S.inv.emails=$('#s3invEmail').value; var i=S.inv.brands.indexOf(id); if (i>=0) S.inv.brands.splice(i,1); else S.inv.brands.push(id);
      el.querySelector('.cb').checked = i<0; var lb=document.querySelector('#s3Layer [data-s3menu="ib:x"] .lb'); lb.innerHTML = S.inv.brands.length?esc(S.inv.brands.join(', ')):'<span class="ph">Choose brands</span>'; return; }
    if (a==='invrole'){ S.inv.emails=$('#s3invEmail').value; S.inv.role=el.dataset.role; return inviteModal(); }
    if (a==='rename') return renameModal(id);
    if (a==='transfer') return transferModal();
    if (a==='xferpick'){ S.xfer=id; return transferModal(); }
    if (a==='deletebrand') return confirmBox('Delete '+id+'?', 'Its library and scheduled posts go too. This can’t be undone.', 'Delete brand', function(){ B.splice(B.indexOf(brand(id)),1); delete A[id]; render(); toast(id+' deleted'); });
  }
  function addPerson(){
    var q = $('#s3addq').value.trim(), r = S.addRole; if (!q) return;
    var ql=q.toLowerCase();
    var p = P.find(function(x){ return x.email.toLowerCase()===ql || (x.name||'').toLowerCase()===ql; });
    var invited=false;
    if (p && p.id===OWNER){ toast('The account admin already has every brand'); return; }
    if (!p){ if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(q)){ toast('No one by that name — enter an email to invite them'); return; } p={id:'u'+Date.now(), name:null, email:q, status:'Invited', sent:'just now'}; P.push(p); invited=true; }
    A[S.axBrand]=A[S.axBrand]||{}; A[S.axBrand][p.id]=r; render(); toast(invited?('Invite sent to '+q):((p.name||p.email)+' added to '+S.axBrand));
  }

  /* ---------- render ---------- */
  function render(){
    var root=$('#setMain'); if (!root) return;
    if (S.tab!=='brands') S.tab='members';
    var tabs = [['members','Members'],['brands','Brands']];
    var body = S.tab==='brands' ? renderBrands() : renderMembers();
    root.innerHTML = '<div class="s3-head"><div><p class="s3-title">Settings</p><p class="s3-hsub">Manage members and who can work on each brand.</p></div><div class="s3-as"><span>Prototype · viewing as</span><div class="s3-seg">'+[['superadmin','Super Admin'],['admin','Account Admin'],['brandadmin','Brand Admin'],['user','User']].map(function(o){ return '<button type="button" class="'+(S.as===o[0]?'on':'')+'" data-s3as="'+o[0]+'">'+o[1]+'</button>'; }).join('')+'</div><label class="s3-failt" title="Prototype only — role changes fail and roll back"><input type="checkbox" data-s3fail'+(S.fail?' checked':'')+'>Fail saves</label></div></div>'+
      '<div class="s3-tabs">'+tabs.map(function(t){ return '<button type="button" class="s3-tab'+(S.tab===t[0]?' on':'')+'" data-s3tab="'+t[0]+'">'+t[1]+'</button>'; }).join('')+'</div>'+body;
    var bill=$('#navBilling'); if (bill) bill.hidden = false;   /* 10/26 모든 역할이 Billing 을 본다(주은님) */
    var u = person(me());
    document.querySelectorAll('#sideUser .su-ava, .topbar .avatar span').forEach(function(x){ x.textContent = initials(u); });
    var nm=document.querySelector('#sideUser .su-btn .su-nm'); if (nm) nm.textContent = u.name;
    var em=document.querySelector('#sideUser .su-btn .su-em'); if (em) em.textContent = u.email;
    writeHash();
  }
  function writeHash(){
    if (!/^#view=settings/.test(location.hash||'')) return;
    var clean = /[#&]clean\b/.test(location.hash) ? '&clean' : '';
    var h = '#view=settings&tab='+S.tab+'&as='+S.as+(S.fail?'&fail':'')+clean;
    if (location.hash!==h) history.replaceState(null,'',h);
  }
  window.renderS3 = render;

  function bind(){
    var root=$('#setMain'); if (!root) return;
    function onClick(e){
      var t;
      if ((t=e.target.closest('[data-s3fail]'))){ S.fail=t.checked; writeHash(); return; }
      if ((t=e.target.closest('[data-s3as]'))){ S.as=t.dataset.s3as; closeMenu(); render(); return; }
      if ((t=e.target.closest('[data-s3tab]'))){ S.tab=t.dataset.s3tab; closeMenu(); render(); return; }
      if ((t=e.target.closest('[data-s3mstatus]'))){ S.mStatus=t.dataset.s3mstatus; render(); return; }
      if ((t=e.target.closest('[data-s3brand]'))){ S.axBrand=t.dataset.s3brand; render(); return; }
      if ((t=e.target.closest('[data-s3menu]'))){ e.stopPropagation(); var k=t.dataset.s3menu; if (S.menu===k){ closeMenu(); return; } openKind(t,k); return; }
      if ((t=e.target.closest('[data-s3rm]'))){ act(t.dataset.s3rm, t.dataset.id); return; }
      if ((t=e.target.closest('[data-s3xfer]'))){ transferModal(); return; }
      if ((t=e.target.closest('[data-s3resend]'))){ var rp=person(t.dataset.s3resend); rp.sent='just now'; render(); toast('Invite sent again to '+rp.email); return; }
      if ((t=e.target.closest('[data-s3]'))){ var a=t.dataset.s3; if (a==='invite'){ S.inv=null; inviteModal(); } else if (a==='createbrand') createBrandModal(); else if (a==='managebrands') openWorkspace(); else if (a==='clearfilters'){ S.mQ=''; S.mStatus='All'; render(); } else if (a==='add') addPerson(); return; }
    }
    root.addEventListener('click', onClick);
    var L=$('#s3Layer');
    L.addEventListener('click', function(e){
      var t;
      if (e.target.closest('[data-s3close]')){ closeLayer(); return; }
      if ((t=e.target.closest('[data-s3menu]'))){ e.stopPropagation(); var k=t.dataset.s3menu; if (S.menu===k){ closeMenu(); return; } openKind(t,k); return; }
      if ((t=e.target.closest('[data-s3do]'))){ var d=t.dataset.s3do;
        if (d==='edsave') saveEdit();
        else if (d==='invsend') sendInvite();
        else if (d==='edremove'){ var pid=S.ed.pid; closeLayer(); act('removemine', pid); }
      }
    });
    root.addEventListener('input', function(e){
      var id=e.target.id, pos=e.target.selectionStart;
      if (id==='s3mq'){ S.mQ=e.target.value; render(); var n=$('#s3mq'); n.focus(); n.setSelectionRange(pos,pos); }
      if (id==='s3axq'){ S.axQ=e.target.value; render(); var n3=$('#s3axq'); n3.focus(); n3.setSelectionRange(pos,pos); }
    });
    root.addEventListener('keydown', function(e){ if (e.target.id==='s3addq' && e.key==='Enter') addPerson(); });
    document.addEventListener('click', function(e){ var t=e.target.closest('#s3Menu [data-s3act]'); if (t){ e.stopPropagation(); act(t.dataset.s3act, t.dataset.id, t); } });
    document.addEventListener('keydown', function(e){ if (e.key==='Escape'){ if (S.menu) closeMenu(); else closeLayer(); } });
    document.addEventListener('input', function(e){ if (e.target.id!=='s3ibq') return; var q=e.target.value.trim().toLowerCase();
      document.querySelectorAll('#s3Menu [data-s3act="invbrand"]').forEach(function(x){ x.hidden = !!q && x.dataset.id.toLowerCase().indexOf(q)<0; }); });
    var nav=$('#navSettings'); if (nav) nav.addEventListener('click', function(){ if (!/^#view=settings/.test(location.hash)) history.replaceState(null,'','#view=settings&tab='+S.tab+'&as='+S.as); showView('settings'); });
  }
  function fromHash(){
    var h=location.hash||''; if (!/^#view=settings/.test(h)) return;
    var g=function(k){ var m=new RegExp('[#&]'+k+'=([\\w-]+)').exec(h); return m?m[1]:null; };
    if (g('tab')) S.tab = g('tab')==='access' ? 'brands' : g('tab'); if (g('as')) S.as=['superadmin','admin','brandadmin','user'].indexOf(g('as'))>=0 ? g('as') : 'superadmin';
    S.fail = /[#&]fail\b/.test(h);
    if (/[#&]clean\b/.test(h)) document.body.classList.add('bk2-clean');
    if (typeof showView==='function') showView('settings'); else render();
  }
  function init(){ var fr=document.querySelector('.frame'), L=$('#s3Layer'); if (fr && L) fr.appendChild(L); bind(); fromHash(); }
  if (document.readyState==='loading') document.addEventListener('DOMContentLoaded', init); else init();
  window.addEventListener('hashchange', fromHash);
  /* 아바타 메뉴의 Settings 도 새 화면으로 연다 (My account 는 예전 화면 그대로) */
  window.openSettingsV3 = function(){ history.replaceState(null,'','#view=settings&tab='+S.tab+'&as='+S.as); showView('settings'); };
  /* 확인용: 화면 상태를 바로 연다 — s3Debug('edit','yejin') · s3Debug('invite') · s3Debug('menu','fdebbie') */
  window.s3Debug = function(what, id){
    if (what==='edit'){ S.ed=null; editModal(id); }
    else if (what==='invite'){ S.inv=null; inviteModal(); }
    else if (what==='menu'){ var b=document.querySelector('[data-s3menu="m:'+id+'"]'); if (b) memberMenu(b,id); }
    else if (what==='brand'){ S.tab='brands'; S.axBrand=id; render(); }
    else if (what==='remove'){ act(isBA()?'removemine':'removemember', id); }
    else if (what==='transfer'){ transferModal(); }
    else if (what==='role'){ var r=document.querySelector('[data-s3menu="r:'+id+'"]'); if (r) openKind(r,'r:'+id); }
  };
})();
</script>

/* ---------------- column sort ---------------- */
const UP = 'arrow-up.svg', DOWN = 'ui-arrow-down.svg';
const MENUS = {
  az:   [['asc', 'Sort A to Z', UP], ['desc', 'Sort Z to A', DOWN]],
  num:  [['desc', 'Sort highest to lowest', DOWN], ['asc', 'Sort lowest to highest', UP]],
  date: [['desc', 'Sort newest to oldest', DOWN], ['asc', 'Sort oldest to newest', UP]],
};
const SORTS = {
  accounts: {
    account:{ menu:'az', get:a => a.name.toLowerCase() }, brands:{ menu:'num', get:a => a.brands }, admins:{ menu:'num', get:a => a.admins },
    ba:{ menu:'num', get:a => a.ba }, users:{ menu:'num', get:a => a.users }, gens:{ menu:'num', get:a => a.gens }, spend:{ menu:'num', get:a => a.spend },
  },
  activity: {
    account:{ menu:'az', get:g => byId(g.acc).name.toLowerCase() }, brand:{ menu:'az', get:g => g.brand.toLowerCase() }, updated:{ menu:'date', get:g => -g.min },
  },
};
function sorted(table, list){
  const s = S.sort[table]; if (!s) return list;   /* nothing sorted = default order (newest first) */
  const get = SORTS[table][s.key].get, k = s.dir === 'asc' ? 1 : -1;
  return [...list].sort((a, b) => { const x = get(a), y = get(b); return (x > y ? 1 : x < y ? -1 : 0) * k; });
}
function sortHead(table, key, label){
  const s = S.sort[table], on = s && s.key === key;
  const opt = on ? MENUS[SORTS[table][key].menu].find(o => o[0] === s.dir) : null;
  return `<button type="button" class="sa-sort${on ? ' sa-sort--active' : ''}" data-sort="${table}:${key}" aria-haspopup="menu" aria-expanded="false">${label}${opt ? `<img class="sa-sort__arrow" src="${IC}${opt[2]}" alt="">` : ''}<img class="sa-sort__caret" src="${IC}caret-down-filled.svg" alt=""></button>`;
}
function openSort(btn){
  const [table, key] = btn.dataset.sort.split(':'), cur = S.sort[table] && S.sort[table].key === key ? S.sort[table] : null;
  const html = MENUS[SORTS[table][key].menu].map(([dir, label, icon]) => `<button type="button" class="menu-item${cur && cur.dir === dir ? ' menu-item--selected' : ''}" role="menuitem" data-sortset="${table}:${key}:${dir}"><span class="sa-sortmenu__label"><img src="${IC}${icon}" alt="">${label}</span><img class="sa-sortmenu__check" src="${IC}panel-check.svg" alt=""></button>`).join('')
    + (cur ? `<button type="button" class="menu-item" role="menuitem" data-sortset="${table}::"><span class="sa-sortmenu__label"><img src="${IC}close-x.svg" alt="">Clear sort</span></button>` : '');
  const m = $('#menu'), fr = $('#frame').getBoundingClientRect(), r = btn.getBoundingClientRect(), k = fr.width / 1920;
  m.innerHTML = `<div class="context-menu sa-sortmenu" role="menu">${html}</div>`; m.hidden = false;
  const left = (r.left - fr.left) / k, right = btn.closest('.num') != null;
  m.style.top = ((r.bottom - fr.top) / k + 6) + 'px';
  m.style.left = (right ? left + r.width / k - m.firstChild.offsetWidth : left) + 'px';
  btn.setAttribute('aria-expanded', 'true');
}

    const stat = (icon, v, l, c) => `<div class="stats-summary__stat"><div class="stats-summary__icon"><img src="${IC}${icon}" alt=""></div><div class="stats-summary__text"><p class="stats-summary__value">${fmt(v)}</p><p class="stats-summary__label">${l}</p><p class="stats-summary__caption">${c}</p></div></div>`;
    body = `<div class="stats-summary">${stat('stat-library-20.svg', L.total, 'Total generations', 'Every version, all statuses')}<div class="stats-summary__divider"></div>${stat('stat-scan-square-20.svg', L.images, 'Images', pct(L.images, L.total) + '% of all generations')}<div class="stats-summary__divider"></div>${stat('stat-scan-square-20.svg', L.carousels, 'Carousels', pct(L.carousels, L.total) + '% of all generations')}<div class="stats-summary__divider"></div>${stat('stat-duration-20.svg', L.videos, 'Videos', pct(L.videos, L.total) + '% of all generations')}</div>`;
    const srow = ([l, v], total, cls = '') => `<div class="sa-srow"><div class="sa-srow-top"><span>${l}</span><b>${v}</b><span class="p">${pct(v, total)}%</span></div><div class="sa-track"><div class="sa-fill ${cls}" style="width:${pct(v, total)}%"></div></div></div>`;
    const bd = (title, total, leftLabel, left, rightLabel, right, note) => `<div class="sa-card sa-bd"><div class="sa-bd-head"><p class="sa-kicker">${title}</p><span class="sa-total">${total} total</span></div>
      <div class="sa-bd-cols"><div class="sa-bd-col"><p class="sa-group-label">${leftLabel}</p>${left.map(r => srow(r, total)).join('')}</div><div class="sa-bd-col"><p class="sa-group-label">${rightLabel}</p>${right.map(r => srow(r, total, 'muted')).join('')}</div></div>
      <p class="sa-note">${note}</p></div>`;
    body += R ? `<div class="sa-grid2">
        ${bd('Carousels by cards generated', L.carousels, 'Cards generated', R.cards, 'Not generated', R.cardsNot, '20 came back with fewer cards than requested — counted at the cards actually generated.')}
        ${bd('Videos by generated length', L.videos, 'Generated length', R.lengths, 'No usable video', R.lengthsNot, '23 edited after generation — counted at their original length.')}
      </div>` : `<div class="sa-card"><p class="sa-empty">This account hasn’t generated anything yet.</p></div>`;
  } else if (S.tab === 'usage'){
    body = periodBar;
    if (!R) body += `<div class="sa-card"><p class="sa-empty">No generations or billed calls in this period.</p></div>`;
    else {
      const P = R.period, tot = P.video[0] + P.image[0] + P.carousel[0], reqTot = P.req.reduce((s, r) => s + r[1], 0);
      body += `<div class="sa-grid2">
        <div class="sa-card"><div class="sa-card-head"><div><h2 class="sa-sectitle">Generations by type</h2><p class="sa-secsub">${tot} versions · ${P.video[1] + P.image[1]} campaigns</p></div></div><div class="sa-card-body">${bars([['Video', P.video[0]], ['Image', P.image[0]], ['Carousel', P.carousel[0]]], tot)}</div></div>
        <div class="sa-card"><div class="sa-card-head"><div><h2 class="sa-sectitle">Videos by requested length</h2><p class="sa-secsub">${reqTot} videos generated</p></div></div><div class="sa-card-body">${bars(P.req, reqTot)}</div></div>
        <div class="sa-card"><div class="sa-card-head"><div><h2 class="sa-sectitle">Model usage</h2><p class="sa-secsub">Billed provider calls</p></div></div><div class="sa-card-body"><div class="sa-kv"><div class="r model h"><span>Model</span><span>Calls</span><span>Seconds</span><span>Rate</span></div>${R.models.map(m => `<div class="r model"><span class="sa-c col"><span class="sa-strong">${m[0]}</span><span class="sa-mono">${m[1]}</span></span><span>${m[2]}</span><span>${m[3]}</span><span>${m[4]}</span></div>`).join('')}</div><p class="sa-note">19 GPT Image 2 calls made before real token cost was recorded use a flat estimate.</p></div></div>
        <div class="sa-card"><div class="sa-card-head"><div><h2 class="sa-sectitle">Cost by model</h2><p class="sa-secsub">USD and AUD</p></div><span class="sa-big">$20.30</span></div><div class="sa-card-body"><div class="sa-kv"><div class="r h"><span>Model</span><span>USD</span><span>AUD</span></div>${R.cost.rows.map(r => `<div class="r ${r[3] === 'sub' ? 'sub' : r[3] === 'total' ? 'total' : ''}"><span>${r[0]}</span><span>${usd(r[1])}</span><span>A${usd(r[2])}</span></div>`).join('')}</div><p class="sa-note">1 USD = 1.4317 AUD · ECB reference rate, Oct 20, 2026. Actual spend is likely a little higher than the estimates.</p></div></div>
      </div>`;
    }
  } else if (S.tab === 'generations'){
    body = periodBar;
    const rows = R ? R.gens : [];
    body += `<div class="sa-card"><div class="sa-tr head"><div class="sa-c gn-id">Campaign</div><div class="sa-c gn-brand">Brand</div><div class="sa-c gn-type">Type</div><div class="sa-c num gn-req">Requested</div><div class="sa-c num gn-got">Generated</div><div class="sa-c gn-status">Status</div><div class="sa-c num gn-created">Created</div></div>
      ${rows.length ? rows.map(g => `<div class="sa-tr"><div class="sa-c gn-id"><span class="sa-mono">${g[0]} · v1</span></div><div class="sa-c gn-brand">${brandPill(g[1])}</div><div class="sa-c gn-type">${g[2]}</div><div class="sa-c num gn-req">${g[3] === '—' ? '<span class="sa-dash">—</span>' : g[3]}</div><div class="sa-c num gn-got sa-strong">${g[4] === '—' ? '<span class="sa-dash">—</span>' : g[4]}</div><div class="sa-c gn-status">${chip(g[5])}</div><div class="sa-c num gn-created sa-mute">${g[6]}</div></div>`).join('') : '<p class="sa-empty">No generations in this period.</p>'}
      <div class="sa-foot"><span>${rows.length ? '1–' + rows.length + ' of 26' : '0 of 0'}</span><span class="sa-pager"><button type="button" class="text-btn text-btn--24" disabled>← Prev</button><span>Page 1 of ${rows.length ? 3 : 1}</span><button type="button" class="text-btn text-btn--24"${rows.length ? '' : ' disabled'}>Next →</button></span></div></div>`;
  } else {
    const M = R ? R.members : [[a.owner, a.email === a.owner ? '' : a.email, 'admin']];
    const none = '<span class="settings-member-row__none">—</span>';
    const row = m => {
      const [name, email, kind, brands = []] = m;
      if (kind === 'invited') return `<div class="settings-member-row settings-member-row--invited"><div class="settings-col settings-col--member"><span class="ai-avatar md">${initials(name)}</span><div class="settings-member-row__identity"><span class="settings-member-row__name">${esc(name)}</span><span class="settings-member-row__meta">Invited 5 hours ago</span></div></div><div class="settings-col settings-col--status"><span class="feedback-status-chip feedback-status-chip--orange">Invited</span></div><div class="settings-col settings-col--brand-admin">${none}</div><div class="settings-col settings-col--user">${brands.map(brandPill).join('')}</div><div class="settings-col settings-col--actions"></div></div>`;
      const ba = kind === 'admin' ? `<span class="brand-pill brand-pill--icon"><img src="${IC}panel-brand.svg" alt="">All ${a.brands} brands</span>` : kind === 'ba' ? brands.map(brandPill).join('') : none;
      const us = kind === 'user' ? brands.map(brandPill).join('') : none;
      return `<div class="settings-member-row"><div class="settings-col settings-col--member"><span class="ai-avatar md">${initials(name)}</span><div class="settings-member-row__identity"><div class="settings-member-row__name-line"><span class="settings-member-row__name">${esc(name)}</span>${kind === 'admin' ? '<span class="feedback-status-chip feedback-status-chip--primary">Admin</span>' : ''}</div><span class="settings-member-row__email">${esc(email || name)}</span></div></div><div class="settings-col settings-col--status"><span class="feedback-status-chip feedback-status-chip--green">Active</span></div><div class="settings-col settings-col--brand-admin">${ba}</div><div class="settings-col settings-col--user">${us}</div><div class="settings-col settings-col--actions">${kind === 'admin' ? `<button type="button" class="more-btn more-btn--sm" data-menu="admin:${a.id}" aria-label="Account admin actions" aria-expanded="false"><img src="${IC}ui-ellipsis.svg" alt=""></button>` : ''}</div></div>`;
    };
    body = `<div class="sa-sechead"><div><h2 class="sa-sectitle">Members</h2><p class="sa-secsub">Read-only. The account's own Admin manages members in Settings; only Super Admin can change who the account admin is.</p></div></div>
      <div class="sa-card"><div class="settings-members-head" style="border-top:0"><div class="settings-col settings-col--member">Member</div><div class="settings-col settings-col--status">Status</div><div class="settings-col settings-col--brand-admin"><img src="${IC}data-shield-check.svg" alt="">Brand Admin</div><div class="settings-col settings-col--user"><img src="${IC}circle-user-round.svg" alt="">User</div><div class="settings-col settings-col--actions"></div></div>${M.map(row).join('')}
      ${R ? `<div class="sa-foot"><span>Showing ${M.length} of ${a.admins + a.ba + a.users + 1} · ${a.admins} Admin · ${a.ba} Brand Admins · ${a.users} Users · 1 pending invitation</span></div>` : ''}</div>`;
  }
  return `<div class="sa-head"><div><button type="button" class="sa-back" onclick="go('accounts')"><img src="${IC}chevron-left.svg" alt="">Accounts</button>
      <div class="sa-titleline"><div><h1 class="sa-title">${esc(a.name)} ${acctChip(a)}</h1><p class="sa-sub">${esc(a.owner)}${a.owner !== a.email ? ' · ' + esc(a.email) : ''} · Created ${a.created} · ${a.brands} ${a.brands === 1 ? 'brand' : 'brands'}${a.status === 'suspended' ? ' · Suspended ' + a.suspendedOn : ''}</p></div></div></div>${action}</div>
    <div class="tab-bar" role="tablist">${tabs.map(([k, l, n]) => `<button type="button" class="tab-item${k === S.tab ? ' tab-item--selected' : ''}" role="tab" onclick="openAccount('${a.id}','${k}')">${l}${n != null ? `<b>${fmt(n)}</b>` : ''}</button>`).join('')}<div class="tab-item tab-item--filler" aria-hidden="true"></div></div>
    ${body}`;
}

/* ---------------- Activity ---------------- */
function renderActivity(){
  const q = S.aq.trim().toLowerCase();
  const list = sorted('activity', ACT.filter(g => (S.afilter === 'all' || (S.afilter === 'failed' && g.status === 'failed') || (S.afilter === 'progress' && g.status === 'rendering'))
    && (!q || (byId(g.acc).name + ' ' + g.brand + ' ' + g.by).toLowerCase().includes(q))));
  const stage = g => !g.clips ? '<span class="sa-dash">—</span>' : g.status === 'rendering' ? `Clip ${g.clips[0] + 1} of ${g.clips[1]}` : `${g.clips[0]} of ${g.clips[1]} ${g.clips[1] === 1 ? 'clip' : 'clips'}`;
  const tr = g => { const a = byId(g.acc); return `<div class="sa-tr${g.stuck ? ' is-stuck' : ''}">
      <div class="sa-c av-account"><div class="sa-c col"><span class="sa-nm">${esc(a.name)}</span>${dupName(a) ? `<span class="sa-mute">${esc(a.owner)}</span>` : ''}</div></div>
      <div class="sa-c av-brand">${brandPill(g.brand)}</div>
      <div class="sa-c av-by"><span class="sa-nm" style="font-weight:var(--font-weight-regular)">${esc(g.by)}</span><span class="feedback-status-chip feedback-status-chip--secondary">${g.role}</span></div>
      <div class="sa-c av-format">${g.format}</div>
      <div class="sa-c av-status">${chip(g.status)}${g.stuck ? '<span class="feedback-status-chip feedback-status-chip--orange">Stuck?</span>' : ''}</div>
      <div class="sa-c av-stage">${stage(g)}</div>
      <div class="sa-c av-updated sa-mute" title="${g.min} minutes ago">${ago(g.min)}</div>
      <div class="sa-c av-err">${g.err ? `<span class="sa-err" title="${esc(g.raw)}">${esc(g.err)}</span>` : '<span class="sa-dash">—</span>'}</div>
      <div class="sa-c end av-act">${(([href, step]) => `<a class="text-btn text-btn--24" href="${href}" target="_blank" rel="noopener" title="Opens where it stopped: ${step}">Open →</a>`)(lastScreen(g))}</div>
    </div>`; };
  return head('Activity', 'Every generation across all accounts and brands, newest first. Open shows the content where it stopped — Generate, Editing or Publish.', '') +
    `<div class="sa-bar">${seg([['all', 'All', FEED.kept], ['progress', 'In progress', FEED.progress], ['failed', 'Failed', FEED.failed]], S.afilter, 'afilter')}${search('Search by account, brand or email', S.aq, 'actQ')}</div>
    <div class="sa-card">
      <div class="sa-tr head"><div class="sa-c av-account">${sortHead('activity', 'account', 'Account')}</div><div class="sa-c av-brand">${sortHead('activity', 'brand', 'Brand')}</div><div class="sa-c av-by">Created by</div><div class="sa-c av-format">Format</div><div class="sa-c av-status">Status</div><div class="sa-c av-stage">Progress</div><div class="sa-c av-updated">${sortHead('activity', 'updated', 'Updated')}</div><div class="sa-c av-err">Last error</div><div class="sa-c av-act"></div></div>
      ${list.length ? list.map(tr).join('') : '<p class="sa-empty">No generations match.</p>'}
      <div class="sa-foot"><span>${list.length} shown · latest 200 kept</span></div>
    </div>`;
}

/* ---------------- menus / modal / toast ---------------- */
const $ = s => document.querySelector(s);
function closeMenu(){ $('#menu').hidden = true; document.querySelectorAll('[aria-expanded="true"]').forEach(b => b.setAttribute('aria-expanded', 'false')); document.querySelectorAll('.sa-tr.hl').forEach(r => r.classList.remove('hl')); }
function openMenu(btn){
  const key = btn.dataset.menu, frame = $('#frame'), fr = frame.getBoundingClientRect(), r = btn.getBoundingClientRect(), k = fr.width / 1920;
  let html;
  if (key.startsWith('admin:')){
    html = `<a class="menu-item" style="text-decoration:none" href="#view=settings">Transfer account admin</a>`;
  } else {
    const a = byId(key);
    html = `<button type="button" class="menu-item" onclick="openAccount('${a.id}')">View details</button>
      <button type="button" class="menu-item" onclick="openAccount('${a.id}','members')">View members</button>
      <div class="menu-divider"></div>` +
      (a.status === 'active' ? `<button type="button" class="menu-item menu-item--danger" onclick="ask('suspend','${a.id}')">Suspend account</button>` : `<button type="button" class="menu-item" onclick="ask('reinstate','${a.id}')">Reinstate account</button>`);
  }
  const m = $('#menu');
  m.innerHTML = `<div class="context-menu">${html}</div>`; m.hidden = false;
  m.style.left = ((r.right - fr.left) / k - 200) + 'px'; m.style.top = ((r.bottom - fr.top) / k + 4) + 'px';
  btn.setAttribute('aria-expanded', 'true'); const row = btn.closest('.sa-tr'); if (row) row.classList.add('hl');
}
function ask(kind, id){
  closeMenu();
  const a = byId(id), who = `${a.admins} Admin, ${a.ba} Brand ${a.ba === 1 ? 'Admin' : 'Admins'} and ${a.users} ${a.users === 1 ? 'User' : 'Users'}`;
  const label = dupName(a) ? `${a.name} (${a.owner})` : a.name;
  const L = $('#layer');
  L.innerHTML = kind === 'suspend'
    ? `<div class="modal sa-dlg" role="dialog" aria-modal="true"><div class="sa-dlg-head"><h3 class="sa-dlg-title">Suspend ${esc(label)}?</h3></div><div class="sa-dlg-body">${who} lose access across ${a.brands} ${a.brands === 1 ? 'brand' : 'brands'}.<ul><li>Scheduled posts stop publishing.</li><li>Nothing is deleted — you can reinstate at any time.</li></ul></div><div class="sa-dlg-foot"><button type="button" class="actions-btn actions-btn--secondary" onclick="closeLayer()">Cancel</button><button type="button" class="actions-btn actions-btn--danger" onclick="setStatus('${a.id}','suspended')">Suspend account</button></div></div>`
    : `<div class="modal sa-dlg" role="dialog" aria-modal="true"><div class="sa-dlg-head"><h3 class="sa-dlg-title">Reinstate ${esc(label)}?</h3></div><div class="sa-dlg-body">${who} can sign in again, and their brands and content come back as they were.</div><div class="sa-dlg-foot"><button type="button" class="actions-btn actions-btn--secondary" onclick="closeLayer()">Cancel</button><button type="button" class="actions-btn actions-btn--primary" onclick="setStatus('${a.id}','active')">Reinstate account</button></div></div>`;
  L.hidden = false;
}
function closeLayer(){ $('#layer').hidden = true; }
function setStatus(id, st){
  const a = byId(id); a.status = st; a.suspendedOn = st === 'suspended' ? 'Oct 26, 2026' : null;
  closeLayer(); render(); toast(st === 'suspended' ? `${a.name} suspended` : `${a.name} reinstated`);
}
let tt; function toast(msg){ closeMenu(); const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(tt); tt = setTimeout(() => t.hidden = true, 2400); }

/* ---------------- render ---------------- */
const CRUMB = { dashboard:'Dashboard', accounts:'Accounts', account:'Accounts', activity:'Activity', settings:'Settings' };
function render(){
  closeMenu();
  const navKey = S.view === 'account' ? 'accounts' : S.view;
  document.querySelectorAll('[data-nav]').forEach(n => n.classList.toggle('active', n.dataset.nav === navKey));
  $('#crumb').textContent = S.view === 'account' ? 'Accounts / ' + byId(S.id).name : CRUMB[S.view];
  document.querySelectorAll('.sa-page').forEach(p => p.hidden = p.dataset.page !== S.view);
  const page = document.querySelector(`.sa-page[data-page="${S.view}"]`);
  if (S.view === 'settings'){ if (window.renderS3) window.renderS3(); }   /* Settings = v3 Settings ver3 (s3-js) */
  else page.innerHTML = ({ dashboard:renderDashboard, accounts:renderAccounts, account:renderAccount, activity:renderActivity })[S.view]();
  $('#meName').textContent = S.name;
}
function rerenderKeepFocus(id){ const el = document.getElementById(id), pos = el ? el.selectionStart : 0; render(); const n = document.getElementById(id); if (n){ n.focus(); n.setSelectionRange(pos, pos); } }

document.addEventListener('click', e => {
  const sh = e.target.closest('[data-sort]');
  if (sh){ e.stopPropagation(); const open = sh.getAttribute('aria-expanded') === 'true'; closeMenu(); if (!open) openSort(sh); return; }
  const si = e.target.closest('[data-sortset]');
  if (si){ const [table, key, dir] = si.dataset.sortset.split(':'); S.sort[table] = key ? { key, dir } : null; render(); return; }
  const m = e.target.closest('[data-menu]');
  if (m){ e.stopPropagation(); const open = m.getAttribute('aria-expanded') === 'true'; closeMenu(); if (!open) openMenu(m); return; }
  if (!e.target.closest('#menu')) closeMenu();
  const s = e.target.closest('[data-act]');
  if (s){ const k = s.dataset.k; if (s.dataset.act === 'filter') S.filter = k; if (s.dataset.act === 'afilter') S.afilter = k; if (s.dataset.act === 'period') S.period = k; render(); return; }
  const o = e.target.closest('[data-open]');
  if (o && !e.target.closest('button')) openAccount(o.dataset.open);
  if (e.target.id === 'layer') closeLayer();
});
document.addEventListener('input', e => {
  if (e.target.id === 'accQ'){ S.q = e.target.value; rerenderKeepFocus('accQ'); }
  if (e.target.id === 'actQ'){ S.aq = e.target.value; rerenderKeepFocus('actQ'); }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape'){ closeMenu(); closeLayer(); } });
$('#meBtn').addEventListener('click', () => toast('Signed in as Super Admin · Sign out lives here'));
window.addEventListener('hashchange', () => { readHash(); render(); $('#main').scrollTop = 0; });

if (new URLSearchParams(location.search).has('shot')) document.querySelector('.home-fab').remove();
readHash(); render();

/* ---------------- fit-to-viewport ---------------- */
function fit(){
  const M = 40, k = Math.min((innerWidth - M * 2) / 1920, (innerHeight - M * 2) / 1162);
  $('#frame').style.transform = `scale(${k})`;
  document.body.style.width = (1920 * k) + 'px'; document.body.style.height = (1162 * k) + 'px';
}
addEventListener('resize', fit); fit();
</script>
</body>
</html>
