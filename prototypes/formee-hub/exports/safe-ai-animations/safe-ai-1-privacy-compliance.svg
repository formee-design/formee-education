<style>
/* Looping entrance (6.5s). In: the front card rises (never fully hidden, opacity .6 at its lowest) with its rows filling right away, the back card (hidden at first) rises once the front card has landed, the shield (check attached) floats up.
   Hold, then out in exact reverse order and mirrored easing: shield sinks, back card sinks, rows retract last-in first-out, front card sinks.
   The bottom edge fades out (mask) so nothing looks cut off. Percentages are of 6.5s (e.g. 13.85% = 0.9s). */
.back, .front, .bar, .ico, .shield { transform-box: fill-box; }
.bar { transform-origin: left center; }
.ico { transform-origin: center; }
.front { animation: kfront 6.5s linear infinite both; }
.i1 { animation: ki1 6.5s linear infinite both; }
.b1 { animation: kb1 6.5s linear infinite both; }
.b2 { animation: kb2 6.5s linear infinite both; }
.i2 { animation: ki2 6.5s linear infinite both; }
.b3 { animation: kb3 6.5s linear infinite both; }
.b4 { animation: kb4 6.5s linear infinite both; }
.back { animation: kback 6.5s linear infinite both; }
.shield { animation: kshield 6.5s linear infinite both; }
@keyframes kfront { 0% { transform: translateY(28px); opacity: .6; animation-timing-function: cubic-bezier(.22,1,.36,1); } 13.85% { transform: translateY(0); opacity: 1; } 86.15% { transform: translateY(0); opacity: 1; animation-timing-function: cubic-bezier(.64,0,.78,0); } 100% { transform: translateY(28px); opacity: .6; } }
@keyframes ki1 { 0% { transform: scale(.6); opacity: 0; } 0.92% { transform: scale(.6); opacity: 0; animation-timing-function: cubic-bezier(.34,1.56,.64,1); } 7.08% { transform: scale(1); opacity: 1; } 81.54% { transform: scale(1); opacity: 1; animation-timing-function: cubic-bezier(.36,0,.66,-.56); } 87.69%, 100% { transform: scale(.6); opacity: 0; } }
@keyframes kb1 { 0% { transform: scaleX(0); opacity: 1; } 0.92% { transform: scaleX(0); opacity: 1; animation-timing-function: cubic-bezier(.4,0,.2,1); } 12.31% { transform: scaleX(1); opacity: 1; } 81.54% { transform: scaleX(1); opacity: 1; animation-timing-function: cubic-bezier(.4,0,.2,1); } 92.92%, 100% { transform: scaleX(0); opacity: 1; } }
@keyframes kb2 { 0% { transform: scaleX(0); opacity: 1; } 3.23% { transform: scaleX(0); opacity: 1; animation-timing-function: cubic-bezier(.4,0,.2,1); } 14.62% { transform: scaleX(1); opacity: 1; } 79.23% { transform: scaleX(1); opacity: 1; animation-timing-function: cubic-bezier(.4,0,.2,1); } 90.62%, 100% { transform: scaleX(0); opacity: 1; } }
@keyframes ki2 { 0% { transform: scale(.6); opacity: 0; } 7.85% { transform: scale(.6); opacity: 0; animation-timing-function: cubic-bezier(.34,1.56,.64,1); } 14% { transform: scale(1); opacity: 1; } 74.62% { transform: scale(1); opacity: 1; animation-timing-function: cubic-bezier(.36,0,.66,-.56); } 80.77%, 100% { transform: scale(.6); opacity: 0; } }
@keyframes kb3 { 0% { transform: scaleX(0); opacity: 1; } 7.85% { transform: scaleX(0); opacity: 1; animation-timing-function: cubic-bezier(.4,0,.2,1); } 19.23% { transform: scaleX(1); opacity: 1; } 74.62% { transform: scaleX(1); opacity: 1; animation-timing-function: cubic-bezier(.4,0,.2,1); } 86%, 100% { transform: scaleX(0); opacity: 1; } }
@keyframes kb4 { 0% { transform: scaleX(0); opacity: 1; } 10.15% { transform: scaleX(0); opacity: 1; animation-timing-function: cubic-bezier(.4,0,.2,1); } 21.54% { transform: scaleX(1); opacity: 1; } 72.31% { transform: scaleX(1); opacity: 1; animation-timing-function: cubic-bezier(.4,0,.2,1); } 83.69%, 100% { transform: scaleX(0); opacity: 1; } }
@keyframes kback { 0% { transform: translateY(28px); opacity: 0; } 15.38% { transform: translateY(28px); opacity: 0; animation-timing-function: cubic-bezier(.22,1,.36,1); } 30.77% { transform: translateY(0); opacity: 1; } 69.23% { transform: translateY(0); opacity: 1; animation-timing-function: cubic-bezier(.64,0,.78,0); } 83.08%, 100% { transform: translateY(28px); opacity: 0; } }
@keyframes kshield { 0% { transform: translateY(18px); opacity: 0; } 24.62% { transform: translateY(18px); opacity: 0; animation-timing-function: cubic-bezier(.22,1,.36,1); } 40% { transform: translateY(0); opacity: 1; } 61.54% { transform: translateY(0); opacity: 1; animation-timing-function: cubic-bezier(.64,0,.78,0); } 72.31%, 100% { transform: translateY(18px); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
