<style>
/* Checklist loop (6.5s). The top row card rises first (never fully hidden, opacity .6 at its lowest), then the next rows follow from below.
   Inside each row, right as it appears, the icon pops, the line fills and the green check (attached) pops in, so empty cards barely show.
   Hold, then everything retracts in exact reverse order with mirrored easing. The bottom edge fades out (mask). Percentages are of 6.5s. */
.row, .ico, .bar, .chk { transform-box: fill-box; }
.ico, .chk { transform-origin: center; }
.bar { transform-origin: left center; }
.r1 { animation: kr1 6.5s linear infinite both; }
.r1i { animation: kr1i 6.5s linear infinite both; }
.r1b { animation: kr1b 6.5s linear infinite both; }
.r1k { animation: kr1k 6.5s linear infinite both; }
.r2 { animation: kr2 6.5s linear infinite both; }
.r2i { animation: kr2i 6.5s linear infinite both; }
.r2b { animation: kr2b 6.5s linear infinite both; }
.r2k { animation: kr2k 6.5s linear infinite both; }
.r3 { animation: kr3 6.5s linear infinite both; }
.r3i { animation: kr3i 6.5s linear infinite both; }
.r3b { animation: kr3b 6.5s linear infinite both; }
.r3k { animation: kr3k 6.5s linear infinite both; }
@keyframes kr1 { 0% { transform: translateY(24px); opacity: .6; } 0% { transform: translateY(24px); opacity: .6; animation-timing-function: cubic-bezier(.22,1,.36,1); } 12.31% { transform: translateY(0); opacity: 1; } 84.62% { transform: translateY(0); opacity: 1; animation-timing-function: cubic-bezier(.64,0,.78,0); } 96.92%, 100% { transform: translateY(24px); opacity: .6; } }
@keyframes kr1i { 0% { transform: scale(.6); opacity: 0; } 0.46% { transform: scale(.6); opacity: 0; animation-timing-function: cubic-bezier(.34,1.56,.64,1); } 6.62% { transform: scale(1); opacity: 1; } 90.31% { transform: scale(1); opacity: 1; animation-timing-function: cubic-bezier(.36,0,.66,-.56); } 96.46%, 100% { transform: scale(.6); opacity: 0; } }
@keyframes kr1b { 0% { transform: scaleX(0); } 0.92% { transform: scaleX(0); animation-timing-function: cubic-bezier(.4,0,.2,1); } 11.69% { transform: scaleX(1); } 85.23% { transform: scaleX(1); animation-timing-function: cubic-bezier(.4,0,.2,1); } 96%, 100% { transform: scaleX(0); } }
@keyframes kr1k { 0% { transform: scale(.4); opacity: 0; } 7.69% { transform: scale(.4); opacity: 0; animation-timing-function: cubic-bezier(.34,1.56,.64,1); } 13.85% { transform: scale(1); opacity: 1; } 83.08% { transform: scale(1); opacity: 1; animation-timing-function: cubic-bezier(.36,0,.66,-.56); } 89.23%, 100% { transform: scale(.4); opacity: 0; } }
@keyframes kr2 { 0% { transform: translateY(24px); opacity: 0; } 5.38% { transform: translateY(24px); opacity: 0; animation-timing-function: cubic-bezier(.22,1,.36,1); } 17.69% { transform: translateY(0); opacity: 1; } 79.23% { transform: translateY(0); opacity: 1; animation-timing-function: cubic-bezier(.64,0,.78,0); } 91.54%, 100% { transform: translateY(24px); opacity: 0; } }
@keyframes kr2i { 0% { transform: scale(.6); opacity: 0; } 5.85% { transform: scale(.6); opacity: 0; animation-timing-function: cubic-bezier(.34,1.56,.64,1); } 12% { transform: scale(1); opacity: 1; } 84.92% { transform: scale(1); opacity: 1; animation-timing-function: cubic-bezier(.36,0,.66,-.56); } 91.08%, 100% { transform: scale(.6); opacity: 0; } }
@keyframes kr2b { 0% { transform: scaleX(0); } 6.31% { transform: scaleX(0); animation-timing-function: cubic-bezier(.4,0,.2,1); } 17.08% { transform: scaleX(1); } 79.85% { transform: scaleX(1); animation-timing-function: cubic-bezier(.4,0,.2,1); } 90.62%, 100% { transform: scaleX(0); } }
@keyframes kr2k { 0% { transform: scale(.4); opacity: 0; } 13.08% { transform: scale(.4); opacity: 0; animation-timing-function: cubic-bezier(.34,1.56,.64,1); } 19.23% { transform: scale(1); opacity: 1; } 77.69% { transform: scale(1); opacity: 1; animation-timing-function: cubic-bezier(.36,0,.66,-.56); } 83.85%, 100% { transform: scale(.4); opacity: 0; } }
@keyframes kr3 { 0% { transform: translateY(24px); opacity: 0; } 10.77% { transform: translateY(24px); opacity: 0; animation-timing-function: cubic-bezier(.22,1,.36,1); } 23.08% { transform: translateY(0); opacity: 1; } 73.85% { transform: translateY(0); opacity: 1; animation-timing-function: cubic-bezier(.64,0,.78,0); } 86.15%, 100% { transform: translateY(24px); opacity: 0; } }
