@keyframes kr3b { 0% { transform: scaleX(0); } 11.69% { transform: scaleX(0); animation-timing-function: cubic-bezier(.4,0,.2,1); } 22.46% { transform: scaleX(1); } 74.46% { transform: scaleX(1); animation-timing-function: cubic-bezier(.4,0,.2,1); } 85.23%, 100% { transform: scaleX(0); } }
